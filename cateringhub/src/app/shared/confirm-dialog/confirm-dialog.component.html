<h2 mat-dialog-title>{{ title | translate }}</h2>
<mat-dialog-content>{{ message | translate }}</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>{{ cancelText | translate }}</button>
  <button mat-button mat-dialog-close cdkFocusInitial (click)="confirm()">
    {{ confirmText | translate }}
  </button>
</mat-dialog-actions>
