<div class="demo-button-container">
  <button mat-raised-button (click)="openUserAddForm()" class="demo-button">
    <mat-icon>person_add</mat-icon>
    {{ "app.users.addButton" | translate }}
  </button>
</div>

<table mat-table [dataSource]="users()">
  <!-- Username Columwn -->
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>
      {{ "app.users.table.columnsNames.username" | translate }}
    </th>
    <td mat-cell *matCellDef="let user">{{ user.username }}</td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>
      {{ "app.users.table.columnsNames.email" | translate }}
    </th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let user">
      <button mat-button color="primary" (click)="editUser(user)">
        {{ "app.users.table.actions.edit" | translate }}
      </button>
      <button mat-button color="warn" (click)="deleteUser(user)">
        {{ "app.users.table.actions.delete" | translate }}
      </button>
    </td>
  </ng-container>

  <!-- Default row with all columns -->
  <tr mat-header-row *matHeaderRowDef="['username', 'email', 'actions']"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: ['username', 'email', 'actions']"
  ></tr>
</table>
