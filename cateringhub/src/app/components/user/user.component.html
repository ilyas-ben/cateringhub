<table mat-table [dataSource]="users" class="mat-elevation-z8">
  <!-- Username Column -->
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Username</th>
    <td mat-cell *matCellDef="let user">{{ user.username }}</td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let user">
      <button mat-button color="primary" (click)="editUser(user)">Edit</button>
      <button mat-button color="warn" (click)="deleteUser(user)">Delete</button>
    </td>
  </ng-container>

  <!-- Default row with all columns -->
  <tr mat-header-row *matHeaderRowDef="['username', 'email', 'actions']"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: ['username', 'email', 'actions']"
  ></tr>
</table>
