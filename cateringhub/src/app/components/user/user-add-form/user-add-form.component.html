<h2 mat-dialog-title>{{ "app.users.addForm.title" | translate }}</h2>

<mat-dialog-content [formGroup]="form" class="container">
  <div class="row mb-3">
    <div class="col-12">
      <mat-form-field class="w-100">
        <input
          matInput
          [placeholder]="'app.users.addForm.fields.username' | translate"
          formControlName="username"
        />
      </mat-form-field>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-12">
      <mat-form-field class="w-100">
        <input
          matInput
          [placeholder]="'app.users.addForm.fields.email' | translate"
          formControlName="email"
          type="email"
        />
      </mat-form-field>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <mat-form-field class="w-100">
        <input
          matInput
          [placeholder]="'app.users.addForm.fields.password' | translate"
          formControlName="password"
          type="text"
        />
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close >{{ "app.users.addForm.buttons.cancel" | translate }}</button>
  <button mat-raised-button (click)="submit()">{{ "app.users.addForm.buttons.save" | translate }}</button>
</mat-dialog-actions>
