<div class="login-container">
  <mat-card>
    <mat-card-title >{{'app.login.title' | translate }}</mat-card-title>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <p>
          <mat-form-field>
            <input
              type="text"
              matInput
              [placeholder]="'app.login.username' | translate"
              formControlName="username"
            />
          </mat-form-field>
        </p>

        <p>
          <mat-form-field>
            <input
              type="password"
              matInput
              [placeholder]="'app.login.password' | translate"
              formControlName="password"
            />
          </mat-form-field>
        </p>

        <div class="button">
          <button type="submit" mat-button>{{ 'app.login.button' | translate }}</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
