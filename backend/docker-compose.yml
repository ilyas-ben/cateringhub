services:
  postgres:
    image: postgres:15
    container_name: cateringhub-pg
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: cateringhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: